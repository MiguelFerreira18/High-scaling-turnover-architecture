apiVersion: apps/v1
kind: Deployment
metadata:
  name: monolith
  namespace: app-namespace
  labels:
    app: monolith
spec:
  selector:
    matchLabels:
      app: monolith
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container:  monolith
      labels:
        app: monolith
    spec:
      containers:
      - name: monolith
        image: monolith:0.0.1
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 240
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
          periodSeconds: 10
        ports:
        - containerPort: 8080
          name: monolith
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: monolith
  namespace: app-namespace
spec:
  selector:
    app: monolith
  type: ClusterIP
  ports:
  - name: monolith
    port: 80
    targetPort: 8080

